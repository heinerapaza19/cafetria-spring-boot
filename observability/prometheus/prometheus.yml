global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "auth"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8041"]

  - job_name: "categoria"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:7091"]

  - job_name: "pago"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:6060"]

  - job_name: "pedido"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9095"]

  - job_name: "producto"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: "reportes"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9070"]