<app-header></app-header>
<div style="padding-top:75px">
  <section style="background:linear-gradient(135deg,#2c1a0e,#5c3317);padding:80px 20px;text-align:center;color:#fff">
    <span style="display:block;color:#c8a97e;font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">Escríbenos</span>
    <h1 style="font-family:'Playfair Display',serif;font-size:48px">CONTÁCTANOS</h1>
  </section>
  <section style="padding:80px 20px;background:#fdf6ef">
    <div class="container">
      <div class="row g-5">
        <div class="col-md-5">
          <h3 style="font-family:'Playfair Display',serif;color:#2c1a0e;margin-bottom:28px">Información de contacto</h3>
          <div style="display:flex;gap:16px;margin-bottom:24px;align-items:flex-start">
            <div style="width:48px;height:48px;background:#c8a97e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0"><i class="fas fa-map-marker-alt"></i></div>
            <div><strong style="color:#2c1a0e">Dirección</strong><br><span style="color:#666">Av. Principal S/N, Ciudad, Perú</span></div>
          </div>
          <div style="display:flex;gap:16px;margin-bottom:24px;align-items:flex-start">
            <div style="width:48px;height:48px;background:#c8a97e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0"><i class="fas fa-phone"></i></div>
            <div><strong style="color:#2c1a0e">Teléfono</strong><br><span style="color:#666">+51 999 888 777</span></div>
          </div>
          <div style="display:flex;gap:16px;margin-bottom:24px;align-items:flex-start">
            <div style="width:48px;height:48px;background:#c8a97e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0"><i class="fas fa-clock"></i></div>
            <div><strong style="color:#2c1a0e">Horarios</strong><br><span style="color:#666">Lun–Vie: 08:00–22:00<br>Sáb–Dom: 09:00–23:00</span></div>
          </div>
        </div>
        <div class="col-md-7">
          <div style="background:#fff;padding:40px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.06)">
            <h3 style="font-family:'Playfair Display',serif;color:#2c1a0e;margin-bottom:28px">Envíanos un mensaje</h3>
            <div style="margin-bottom:18px"><label style="display:block;font-size:12px;font-weight:600;color:#666;text-transform:uppercase;margin-bottom:6px">Nombre</label><input style="width:100%;padding:12px 16px;border:2px solid #e8d9c8;border-radius:8px;font-size:14px;outline:none" placeholder="Tu nombre"></div>
            <div style="margin-bottom:18px"><label style="display:block;font-size:12px;font-weight:600;color:#666;text-transform:uppercase;margin-bottom:6px">Email</label><input type="email" style="width:100%;padding:12px 16px;border:2px solid #e8d9c8;border-radius:8px;font-size:14px;outline:none" placeholder="tu&#64;email.com"></div>
            <div style="margin-bottom:24px"><label style="display:block;font-size:12px;font-weight:600;color:#666;text-transform:uppercase;margin-bottom:6px">Mensaje</label><textarea rows="4" style="width:100%;padding:12px 16px;border:2px solid #e8d9c8;border-radius:8px;font-size:14px;outline:none;resize:vertical" placeholder="¿En qué podemos ayudarte?"></textarea></div>
            <button class="btn-primary-cafe">ENVIAR MENSAJE</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<app-footer></app-footer>
